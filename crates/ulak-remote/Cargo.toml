[package]
name = "ulak-remote"
version = "0.1.4"
edition = "2021"

[dependencies]
ulak-proto = { path = "../ulak-proto" }
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
sha2 = "0.11.1"
rand = "0.10.4"
time = { version = "0.3.55", features = ["parsing"] }

x509-parser = "0.18"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["fs", "rt-multi-thread", "signal", "macros", "net", "time", "sync", "io-std", "io-util"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
webauthn-rs = { version = "0.6.2", features = ["danger-allow-state-serialisation"] }
chacha20poly1305 = "0.11"
ulakd = { path = "../ulakd" }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
tokio-util = { version = "0.7", features = ["io"] }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }

[dev-dependencies]
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
webauthn-authenticator-rs = { version = "0.6.2", features = ["softpasskey"] }
