[workspace]
resolver = "2"
members = ["crates/ulak-proto", "crates/ulak-remote", "crates/ulakd", "crates/ulak"]

# Rune's own `[patch.crates-io]` does not apply to workspaces that depend on it, so repeat it (same rev).
