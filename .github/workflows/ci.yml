# Push to main: Linux tests, web, and the Windows/macOS app portability check. Linux jobs run on
# `vars.LINUX_RUNNER` if set (see release.yml), else GitHub-hosted.
name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  # A full debug test build with debug info is ~14 GB; without it a few GB (self-hosted disk).
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
jobs:
  build:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    container: ubuntu:22.04
    steps:
      # Root inside the container: packages install without sudo, on hosted and self-hosted runners.
      - name: Base packages
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends curl ca-certificates git jq build-essential pkg-config perl cmake procps tmux libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev
      - uses: actions/checkout@v4.2.2
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (the PNG snapshot test needs a GPU, which the runner lacks)
        run: cargo test --workspace -- --skip snap_writes_a_png_per_scene
      - name: Free disk
        if: always()
        run: rm -rf target
      # Files written as root in the container would block the next checkout on a self-hosted runner.
      - name: Hand the workspace back to the runner user
        if: always()
        run: chown -R "$(stat -c %u:%g "$RUNNER_TEMP")" "$GITHUB_WORKSPACE" || true
  web:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    container: node:22-bookworm
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Hand the workspace back to the runner user
        if: always()
        working-directory: .
        run: chown -R "$(stat -c %u:%g "$RUNNER_TEMP")" "$GITHUB_WORKSPACE" || true
  # Portability guard for the native UI: compile + lib tests only (no GPU snapshot/e2e tests).
  ui-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p ulak --locked
      - run: cargo test -p ulak --lib --locked
