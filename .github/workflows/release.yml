# Release pipeline.
# Build jobs only compile and upload artifacts; ONE job (sign) holds the secret, writes SHA256SUMS and signs everything.
# Needs the repo secret ULAK_RELEASE_SIGNING_KEY (see scripts/gen-release-key.sh) and a real
# crates/ulakd/release-key.pub committed. Docker images for the tag are built by the last job (docker.yml as a reusable workflow).
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, package and sign but do not publish a release
        type: boolean
        default: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-gnu
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2.7.8
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: arm64 target (ulakd only, cross-compiled)
        run: rustup target add aarch64-unknown-linux-gnu
      - name: Tag must equal the workspace version
        id: ver
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          versions=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].version' | sort -u)
          if [ "$(printf '%s\n' "$versions" | wc -l)" != 1 ]; then
            echo "workspace crates disagree on the version: $versions" >&2; exit 1
          fi
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$versions" ]; then
            echo "tag $REF_NAME does not match workspace version v$versions" >&2; exit 1
          fi
          echo "version=$versions" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          GIT_SHA: ${{ github.sha }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --locked -p ulakd -p ulak-remote -p ulak --target "$TARGET"
          cargo build --release --locked -p ulakd --target aarch64-unknown-linux-gnu
      - name: Package
        run: |
          set -euo pipefail
          mkdir dist
          for bin in ulakd ulak-remote ulak; do
            tar -C "target/$TARGET/release" -czf "dist/$bin-$TARGET.tar.gz" "$bin"
          done
          tar -C target/aarch64-unknown-linux-gnu/release -czf dist/ulakd-aarch64-unknown-linux-gnu.tar.gz ulakd
          ls -l dist
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error
  # Native UI for Windows and macOS. The hub and daemon stay Linux-only (tmux, /proc, Docker).
  # Intel macOS is cross-compiled on the Apple Silicon runner: no dependency on a (retiring) Intel runner label.
  # No tests here (no GPU); ci.yml runs `cargo check` and the lib tests on both OSes.
  build-ui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.7.8
        with:
          key: ${{ matrix.target }}
      - name: Build
        shell: bash
        env:
          GIT_SHA: ${{ github.sha }}
        run: cargo build --release --locked -p ulak --target "${{ matrix.target }}"
      # tar.gz everywhere (Windows 10+ opens it natively): the app self-updates from this archive.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          bin=ulak; [ "${{ runner.os }}" = Windows ] && bin=ulak.exe
          tar -C "target/${{ matrix.target }}/release" -czf "dist/ulak-${{ matrix.target }}.tar.gz" "$bin"
          tar -tzvf "dist/ulak-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  # The only job that sees the signing secret.
  sign:
    needs: [build, build-ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Sign (ed25519, detached raw signatures)
        env:
          SIGNING_KEY: ${{ secrets.ULAK_RELEASE_SIGNING_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/key.pem"
          if [ -n "$SIGNING_KEY" ]; then
            printf '%s\n' "$SIGNING_KEY" > "$key"
          elif [ "$DRY_RUN" = true ]; then
            echo "::warning::no ULAK_RELEASE_SIGNING_KEY secret; dry run signs with a throwaway key"
            openssl genpkey -algorithm ed25519 -out "$key"
          else
            echo "ULAK_RELEASE_SIGNING_KEY is not set; run scripts/gen-release-key.sh" >&2; exit 1
          fi
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/pub.pem"
          pub_hex=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | xxd -p -c 64)
          committed=$(head -n1 crates/ulakd/release-key.pub || true)
          if [ -n "$SIGNING_KEY" ] && [ "$committed" != "$pub_hex" ]; then
            echo "crates/ulakd/release-key.pub does not match the signing secret (installed daemons would refuse this release)" >&2
            [ "$DRY_RUN" = true ] || exit 1
          fi
          cd dist
          for f in ./*.tar.gz SHA256SUMS; do
            openssl pkeyutl -sign -rawin -inkey "$key" -in "$f" -out "$f.sig"
            openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/pub.pem" -in "$f" -sigfile "$f.sig"
          done
          shred -u "$key"
          ls -l
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error
  publish:
    needs: sign
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: release-dist
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # workflow_dispatch from a branch has no tag to release.
          [ "${{ github.ref_type }}" = tag ] || { echo "publishing needs a v* tag ref" >&2; exit 1; }
          gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
  # Images for the tag are built only after the release exists: the hub image bundles its signed node archives.
  docker:
    needs: publish
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
